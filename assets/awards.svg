<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 290" role="img" aria-label="2nd worldwide, 1st in department, best paper award, three Huawei ICT Academy medals">
  <defs><linearGradient id="ga" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="640" y2="0" spreadMethod="repeat"><stop offset="0" stop-color="#22d3ee"/><stop offset=".33" stop-color="#818cf8"/><stop offset=".66" stop-color="#e879f9"/><stop offset="1" stop-color="#22d3ee"/><animateTransform attributeName="gradientTransform" type="translate" from="0 0" to="640 0" dur="5s" repeatCount="indefinite"/></linearGradient><radialGradient id="o0"><stop offset="0" stop-color="#06b6d4" stop-opacity=".4"/><stop offset="1" stop-color="#06b6d4" stop-opacity="0"/></radialGradient><radialGradient id="o1"><stop offset="0" stop-color="#db2777" stop-opacity=".32"/><stop offset="1" stop-color="#db2777" stop-opacity="0"/></radialGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="#fff" fill-opacity=".07"/></pattern>
    <clipPath id="card"><rect width="1200" height="290" rx="18"/></clipPath>
  </defs>
  <style>.ring{animation:draw 1.2s cubic-bezier(.3,.6,.2,1) backwards}@keyframes draw{from{stroke-dashoffset:var(--per)}to{stroke-dashoffset:0}}.spin{transform-box:fill-box;transform-origin:center;animation:spin 26s linear infinite}.rev{animation-direction:reverse}@keyframes spin{to{transform:rotate(360deg)}}.orbit{offset-path:path('M0 46a58 58 0 1 1 0 116a58 58 0 1 1 0-116');animation:orbit 5.2s linear infinite}@keyframes orbit{from{offset-distance:0%}to{offset-distance:100%}}@supports not (offset-path:path('M0 0')){.orbit{display:none}}.rise{animation:rise .6s ease-out backwards}@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}@media (prefers-reduced-motion:reduce){*{animation:none!important}.nomo{display:none}}</style>
  <g clip-path="url(#card)">
    <rect width="1200" height="290" fill="#070910"/><circle cx="200" cy="58" r="261" fill="url(#o0)"><animate attributeName="cx" values="200;290;200" dur="12s" repeatCount="indefinite"/></circle><circle cx="1000" cy="275.5" r="261" fill="url(#o1)"><animate attributeName="cx" values="1000;920;1000" dur="14s" repeatCount="indefinite"/></circle>
    <rect width="1200" height="290" fill="url(#dots)"/>
    <g transform="translate(150 0)">
      <circle cy="104" r="73" fill="none" stroke="#2a2f4a" stroke-width="2" stroke-dasharray="2 9" class="spin"/>
      <circle cy="104" r="58" fill="#818cf8" fill-opacity=".1"/>
      <circle cy="104" r="58" fill="none" stroke="url(#ga)" stroke-width="4.5" stroke-linecap="round" transform="rotate(-90 0 104)" class="ring" style="stroke-dasharray:364.4247;--per:364.4247;animation-delay:0.3s"/>
      <circle r="5" fill="#fff" class="orbit nomo" style="animation-delay:0s"/>
      <text y="121" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="48" font-weight="700" fill="#fff" class="rise" style="animation-delay:0.8s">2nd</text>
      <g class="rise" style="animation-delay:1s" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
        <text y="214" font-size="22" font-weight="600" fill="#fff">worldwide</text>
        <text y="240" font-size="15.5" fill="#a5b4fc">Huawei ICT Innovation</text><text y="261" font-size="15.5" fill="#a5b4fc">Competition 2025</text>
      </g></g><g transform="translate(450 0)">
      <circle cy="104" r="73" fill="none" stroke="#2a2f4a" stroke-width="2" stroke-dasharray="2 9" class="spin rev"/>
      <circle cy="104" r="58" fill="#818cf8" fill-opacity=".1"/>
      <circle cy="104" r="58" fill="none" stroke="url(#ga)" stroke-width="4.5" stroke-linecap="round" transform="rotate(-90 0 104)" class="ring" style="stroke-dasharray:364.4247;--per:364.4247;animation-delay:0.6s"/>
      <circle r="5" fill="#fff" class="orbit nomo" style="animation-delay:-1.3s"/>
      <text y="121" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="48" font-weight="700" fill="#fff" class="rise" style="animation-delay:1.1s">1st</text>
      <g class="rise" style="animation-delay:1.3s" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
        <text y="214" font-size="22" font-weight="600" fill="#fff">in my department</text>
        <text y="240" font-size="15.5" fill="#a5b4fc">B.Sc. Artificial Intelligence</text><text y="261" font-size="15.5" fill="#a5b4fc">GPA 3.8 / 4.0</text>
      </g></g><g transform="translate(750 0)">
      <circle cy="104" r="73" fill="none" stroke="#2a2f4a" stroke-width="2" stroke-dasharray="2 9" class="spin"/>
      <circle cy="104" r="58" fill="#818cf8" fill-opacity=".1"/>
      <circle cy="104" r="58" fill="none" stroke="url(#ga)" stroke-width="4.5" stroke-linecap="round" transform="rotate(-90 0 104)" class="ring" style="stroke-dasharray:364.4247;--per:364.4247;animation-delay:0.9s"/>
      <circle r="5" fill="#fff" class="orbit nomo" style="animation-delay:-2.6s"/>
      <text y="121" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="48" font-weight="700" fill="#fff" class="rise" style="animation-delay:1.4s">2nd</text>
      <g class="rise" style="animation-delay:1.6s" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
        <text y="214" font-size="22" font-weight="600" fill="#fff">best paper award</text>
        <text y="240" font-size="15.5" fill="#a5b4fc">IEEE ICMISI 2026</text><text y="261" font-size="15.5" fill="#a5b4fc"></text>
      </g></g><g transform="translate(1050 0)">
      <circle cy="104" r="73" fill="none" stroke="#2a2f4a" stroke-width="2" stroke-dasharray="2 9" class="spin rev"/>
      <circle cy="104" r="58" fill="#818cf8" fill-opacity=".1"/>
      <circle cy="104" r="58" fill="none" stroke="url(#ga)" stroke-width="4.5" stroke-linecap="round" transform="rotate(-90 0 104)" class="ring" style="stroke-dasharray:364.4247;--per:364.4247;animation-delay:1.2s"/>
      <circle r="5" fill="#fff" class="orbit nomo" style="animation-delay:-3.9s"/>
      <text y="121" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="48" font-weight="700" fill="#fff" class="rise" style="animation-delay:1.7s">3×</text>
      <g class="rise" style="animation-delay:1.9s" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
        <text y="214" font-size="22" font-weight="600" fill="#fff">medals</text>
        <text y="240" font-size="15.5" fill="#a5b4fc">Huawei ICT Academy</text><text y="261" font-size="15.5" fill="#a5b4fc">Platinum, Gold, Silver</text>
