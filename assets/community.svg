        <text x="152" y="192" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" fill="#a5b4fc">Google Developer Groups</text></g></g><line x1="264" x2="264" y1="44" y2="188" stroke="#2a2f4a" stroke-dasharray="3 7" class="ants"/><g text-anchor="middle"><g class="rise" style="animation-delay:0.47s">
        <text x="376" y="86" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="46" font-weight="800" fill="url(#ga)">10+</text>
