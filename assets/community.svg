<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 232" role="img" aria-label="Community leadership roles">
  <defs><linearGradient id="ga" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="640" y2="0" spreadMethod="repeat"><stop offset="0" stop-color="#22d3ee"/><stop offset=".33" stop-color="#818cf8"/><stop offset=".66" stop-color="#e879f9"/><stop offset="1" stop-color="#22d3ee"/><animateTransform attributeName="gradientTransform" type="translate" from="0 0" to="640 0" dur="5s" repeatCount="indefinite"/></linearGradient><radialGradient id="o0"><stop offset="0" stop-color="#06b6d4" stop-opacity=".4"/><stop offset="1" stop-color="#06b6d4" stop-opacity="0"/></radialGradient><radialGradient id="o1"><stop offset="0" stop-color="#7c3aed" stop-opacity=".5"/><stop offset="1" stop-color="#7c3aed" stop-opacity="0"/></radialGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="#fff" fill-opacity=".07"/></pattern>
    <clipPath id="card"><rect width="1200" height="232" rx="18"/></clipPath>
  </defs>
  <style>.rise{animation:rise .6s ease-out backwards}@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}.bar{transform-box:fill-box;transform-origin:center;animation:grow .7s cubic-bezier(.2,.8,.2,1) backwards, breathe 3s ease-in-out 1.6s infinite}@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}@keyframes breathe{50%{transform:scaleX(.45)}}.ants{animation:ants 1.6s linear infinite}@keyframes ants{to{stroke-dashoffset:-20}}@media (prefers-reduced-motion:reduce){*{animation:none!important}.nomo{display:none}}</style>
  <g clip-path="url(#card)">
    <rect width="1200" height="232" fill="#070910"/><circle cx="140" cy="208.8" r="240" fill="url(#o0)"><animate attributeName="cx" values="140;230;140" dur="12s" repeatCount="indefinite"/></circle><circle cx="1060" cy="46.4" r="240" fill="url(#o1)"><animate attributeName="cx" values="1060;970;1060" dur="14s" repeatCount="indefinite"/></circle>
    <rect width="1200" height="232" fill="url(#dots)"/>
