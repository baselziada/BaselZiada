        <text x="376" y="192" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" fill="#a5b4fc">Microsoft Learn</text></g></g><line x1="488" x2="488" y1="44" y2="188" stroke="#2a2f4a" stroke-dasharray="3 7" class="ants"/><g text-anchor="middle"><g class="rise" style="animation-delay:0.69s">
        <text x="600" y="86" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="46" font-weight="800" fill="url(#ga)">30+</text>
        <text x="600" y="112" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="14.5" fill="#64748b">startup teams</text></g>
      <rect x="566" y="128" width="68" height="3" rx="1.5" fill="url(#ga)" class="bar" style="animation-delay:0.99s"/>
      <g class="rise" style="animation-delay:1.04s"><text x="600" y="168" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="19" font-weight="600" fill="#fff">Campus Director</text>
        <text x="600" y="192" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" fill="#a5b4fc">Hult Prize</text></g></g><line x1="712" x2="712" y1="44" y2="188" stroke="#2a2f4a" stroke-dasharray="3 7" class="ants"/><g text-anchor="middle"><g class="rise" style="animation-delay:0.91s">
        <text x="824" y="86" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="46" font-weight="800" fill="url(#ga)">300+</text>
        <text x="824" y="112" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="14.5" fill="#64748b">students trained</text></g>
      <rect x="790" y="128" width="68" height="3" rx="1.5" fill="url(#ga)" class="bar" style="animation-delay:1.21s"/>
      <g class="rise" style="animation-delay:1.26s"><text x="824" y="168" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="19" font-weight="600" fill="#fff">Cloud Ambassador</text>
        <text x="824" y="192" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" fill="#a5b4fc">Huawei Cloud</text></g></g><line x1="936" x2="936" y1="44" y2="188" stroke="#2a2f4a" stroke-dasharray="3 7" class="ants"/><g text-anchor="middle"><g class="rise" style="animation-delay:1.13s">
        <text x="1048" y="86" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="46" font-weight="800" fill="url(#ga)">300+</text>
        <text x="1048" y="112" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="14.5" fill="#64748b">students reached</text></g>
      <rect x="1014" y="128" width="68" height="3" rx="1.5" fill="url(#ga)" class="bar" style="animation-delay:1.43s"/>
      <g class="rise" style="animation-delay:1.48s"><text x="1048" y="168" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="19" font-weight="600" fill="#fff">Academy Ambassador</text>
        <text x="1048" y="192" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" fill="#a5b4fc">Huawei ICT Academy</text></g></g>
  </g>
  <rect x="1" y="1" width="1198" height="230" rx="18" fill="none" stroke="url(#ga)" stroke-width="2"/>
