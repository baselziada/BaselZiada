<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 270" role="img" aria-label="A path that has climbed every year since 2022 and is still going">
  <defs><linearGradient id="ga" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="640" y2="0" spreadMethod="repeat"><stop offset="0" stop-color="#22d3ee"/><stop offset=".33" stop-color="#818cf8"/><stop offset=".66" stop-color="#e879f9"/><stop offset="1" stop-color="#22d3ee"/><animateTransform attributeName="gradientTransform" type="translate" from="0 0" to="640 0" dur="5s" repeatCount="indefinite"/></linearGradient><radialGradient id="o0"><stop offset="0" stop-color="#7c3aed" stop-opacity=".5"/><stop offset="1" stop-color="#7c3aed" stop-opacity="0"/></radialGradient><radialGradient id="o1"><stop offset="0" stop-color="#06b6d4" stop-opacity=".4"/><stop offset="1" stop-color="#06b6d4" stop-opacity="0"/></radialGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="#fff" fill-opacity=".07"/></pattern>
    <clipPath id="card"><rect width="1200" height="270" rx="18"/></clipPath><linearGradient id="area" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#818cf8" stop-opacity=".3"/><stop offset="1" stop-color="#818cf8" stop-opacity="0"/></linearGradient><linearGradient id="fade" gradientUnits="userSpaceOnUse" x1="872" x2="1160" y1="0" y2="0"><stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></linearGradient>
  </defs>
  <style>.path{stroke-dasharray:792.9051;animation:draw 2.6s linear 0.3s backwards}@keyframes draw{from{stroke-dashoffset:792.9051}to{stroke-dashoffset:0}}.area{animation:fade 1.2s ease-out 2.5s backwards}.next{animation:fade .6s ease-out 2.9s backwards, ants 1s linear infinite}@keyframes fade{from{opacity:0}to{opacity:1}}@keyframes ants{to{stroke-dashoffset:-24}}.pop{animation:fade .4s ease-out backwards}.ping{fill:none;stroke-width:2;transform-box:fill-box;transform-origin:center;opacity:0;animation:ping 2.2s ease-out 2.9s infinite}@keyframes ping{0%{opacity:.8;transform:scale(1)}100%{opacity:0;transform:scale(3.4)}}.comet{opacity:0;offset-path:path('M872 72C1022 72 1040 30 1190 30');animation:fly 2.6s cubic-bezier(.4,0,.7,1) 3.1s infinite}@keyframes fly{0%{offset-distance:0%;opacity:0}12%{opacity:1}70%{opacity:1}100%{offset-distance:92%;opacity:0}}@supports not (offset-path:path('M0 0')){.comet{display:none}}@media (prefers-reduced-motion:reduce){*{animation:none!important}.nomo{display:none}}</style>
