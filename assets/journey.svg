    <path d="M96 206C193.0 206 193.0 184 290 184C387.0 184 387.0 152 484 152C581.0 152 581.0 110 678 110C775.0 110 775.0 72 872 72L872 224L96 224Z" fill="url(#area)" class="area"/>
    <path d="M872 72C1022 72 1040 30 1190 30" fill="none" stroke="url(#fade)" stroke-width="3" stroke-dasharray="12 12" stroke-linecap="round" class="next"/>
    <path d="M96 206C193.0 206 193.0 184 290 184C387.0 184 387.0 152 484 152C581.0 152 581.0 110 678 110C775.0 110 775.0 72 872 72" fill="none" stroke="url(#ga)" stroke-width="4" stroke-linecap="round" class="path"/><g class="pop" style="animation-delay:0.3s"><line x1="96" x2="96" y1="220" y2="224" stroke="#2a2f4a" stroke-width="1.5" stroke-dasharray="2 6"/><circle cx="96" cy="206" r="9" fill="#070910" stroke="#a5b4fc" stroke-width="3"/><text x="96" y="248" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="15" fill="#64748b">2022</text></g><g class="pop" style="animation-delay:0.9419s"><line x1="290" x2="290" y1="198" y2="224" stroke="#2a2f4a" stroke-width="1.5" stroke-dasharray="2 6"/><circle cx="290" cy="184" r="9" fill="#070910" stroke="#a5b4fc" stroke-width="3"/><text x="290" y="248" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="15" fill="#64748b">2023</text></g><g class="pop" style="animation-delay:1.5902s"><line x1="484" x2="484" y1="166" y2="224" stroke="#2a2f4a" stroke-width="1.5" stroke-dasharray="2 6"/><circle cx="484" cy="152" r="9" fill="#070910" stroke="#a5b4fc" stroke-width="3"/><text x="484" y="248" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="15" fill="#64748b">2024</text></g><g class="pop" style="animation-delay:2.2469s"><line x1="678" x2="678" y1="124" y2="224" stroke="#2a2f4a" stroke-width="1.5" stroke-dasharray="2 6"/><circle cx="678" cy="110" r="9" fill="#070910" stroke="#a5b4fc" stroke-width="3"/><text x="678" y="248" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="15" fill="#64748b">2025</text></g><circle cx="872" cy="72" r="9" stroke="#22d3ee" class="ping nomo"/><circle cx="872" cy="72" r="9" stroke="#22d3ee" class="ping nomo" style="animation-delay:4s"/><g class="pop" style="animation-delay:2.9s"><line x1="872" x2="872" y1="86" y2="224" stroke="#2a2f4a" stroke-width="1.5" stroke-dasharray="2 6"/><circle cx="872" cy="72" r="9" fill="#22d3ee" stroke="#22d3ee" stroke-width="3"/><text x="872" y="248" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="15" fill="#22d3ee">2026</text></g>
